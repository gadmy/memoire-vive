<!DOCTYPE html>
<!--
    SUIVI DE PROJET
    MEMOIRE VIVE
    Jeu web vanilla JS, sans dependance ni outil de construction.
    index.html tient la page et ce suivi, css/mv.css la feuille de style,
    js/*.js les huit morceaux du script, charges dans l'ordre.
    Pour jouer : ouvrir ce fichier. Aucun serveur n'est necessaire.

    VERSION : 3
    (la conversation en cours deviendra la v4 a la cloture : le numero ne
     bouge qu'au changement de conversation, jamais en cours de route)

    ================================================================
    CONVERSATION EN COURS - CE QUI VIENT D'ETRE FAIT
    ================================================================

    ILS TRAVAILLENT, ET CA SE VOIT. Arrive a son poste, un clone ne se fige
    plus : il fait quelques pas dans SA salle, s'arrete, reprend. Les arrets
    sont ses gestes de travail, et c'est pendant ceux-la que son point pulse.
    Un oisif erre plus loin et plus lentement, un dormeur s'eteint a moitie :
    on lit ce que fait l'equipage sans ouvrir une seule fiche.

    CHAQUE SALLE DIT CE QU'ELLE FAIT. Une ligne sous son nom, sur le plan :
    soit un DEBIT pour ce qui ne finit jamais ("+13 en/j", "+6 oxy/j"), soit
    l'AVANCEMENT d'un chantier qui aura une fin - une cuve, une reparation, un
    menage - avec ce qu'il reste a tenir. La fiche donne le detail et une barre
    de progression. Le temps est compte EN JOURS et non en minutes : une minute
    reelle ne veut rien dire quand on passe de x1 a x16 quand on veut, alors
    qu'un jour reste un jour.

    LES DECHETS NE TOMBENT PLUS DU CIEL. Ils naissent LA OU SONT LES GENS :
    chaque corps salit la salle ou il se trouve, chaque salle en marche se
    salit toute seule, les repas salissent la salle de vie et un mort la sienne.
    Rien n'arrive jamais directement dans la cuve a dechets. Il faut que
    quelqu'un aille NETTOYER pour que la crasse y descende - et c'est de cette
    cuve que le recyclage tire l'eau et la matiere. Negliger le menage, c'est
    se priver des deux : le balai est devenu la source des materiaux.

    UNE SALLE A MOITIE TENUE TOURNE A MOITIE. Elle ne s'arrete plus. Elle
    affiche "REGIME 50%" et, surtout, elle ne tire plus que la MOITIE du
    courant : l'energie se paie desormais au prorata des postes tenus. Avant,
    sous-staffer coutait le prix fort pour un demi-resultat, et on n'avait donc
    jamais interet a mettre une seule personne quelque part.

    ILS SE DEBROUILLENT SEULS. Un clone epuise quitte son poste, va dormir a la
    salle de vie et revient une fois repose ; un clone affame va manger et
    retourne travailler. On n'a pas a le leur dire - vous etes une voix dans
    les murs, pas un contremaitre. Le poste quitte lui reste RESERVE : le plan
    ecrit 1(2)/2 pour dire "un present, un au lit". Il n'y a que quatre places
    dans la salle de vie : au-dela, on travaille fatigue.

    UN DEFAUT DE FOND CORRIGE : ON MARCHE EN TEMPS DE JEU. Le deplacement se
    comptait en secondes reelles alors que la faim et la fatigue se comptent en
    jours. A x16, traverser le vaisseau coutait donc trois jours, et l'equipage
    passait sa vie dans les coursives a mourir de faim. Tout est passe en
    jours ; en prime, la simulation ne depend plus de la vitesse d'affichage.

    LE REGLAGE A SUIVI. Les besoins ont ete espaces (on a faim et on se fatigue
    moins vite, on mange plus tard) parce qu'entre les repas et le sommeil
    l'equipage etait absent plus d'un tiers du temps. Un corps respire un peu
    moins, pour qu'un seul fermier puisse tenir huit personnes. Relais atteint
    au jour 680 environ avec un pilote mediocre.

    ================================================================
    ETAT DES CHANTIERS
    ================================================================

    CE QUI RESTE VRAIMENT A FAIRE
    1. JOUER CETTE TRANCHE ET LE DIRE. Est-ce tendu ? Est-ce lisible ?
    2. Le reglage des chiffres : tout est dans js/00-config.js. Trois versions
       de suite ont ete equilibrees au banc, jamais a la main : le ressenti
       reste entierement a confirmer.
    3. Les trois questions de conception encore ouvertes : la desobeissance
       (un clone demoralise travaille-t-il mal, ou refuse-t-il ?), ce que veut
       dire gagner, et l'echelle du die and retry (sauvegarde ou arche neuve).
    4. L'ordre ATTAQUER est en place mais toujours grise : il attend les
       hostiles.

    CE QUI VIENDRA SE BRANCHER DESSUS, DANS L'ORDRE PROBABLE
    - Le sas et les sorties : epaves, planetes, points bleus et rouges.
    - Les extraterrestres : abordage et vaisseau contre vaisseau. Les ordres
      ATTAQUER et DEFENDRE les attendent deja.
    - Le chantier : poser, demolir et agrandir la coque. Des lits en plus
      seraient le premier vrai besoin : quatre places, c'est peu.
    - L'armurerie : vetements, armes, materiel de minage.
    - La carte des etoiles et le choix du cap.
    - La technologie extraterrestre a etudier.

    LOG
    v3 - la salle devient un lieu de travail. Gestes dans la salle et points
        qui pulsent, debit ou avancement affiche par salle, dechets devenus
        locaux (le menage est la seule porte vers la cuve, donc vers les
        materiaux), energie et regime au prorata des postes tenus, repos et
        repas automatiques avec poste reserve et quatre lits. Defaut de fond
        corrige : la marche se comptait en secondes reelles alors que les
        besoins se comptent en jours - a x16 l'equipage vivait dans les
        coursives. Tout est passe en temps de jeu.
    v2 - on prend les gens a la main. Glisser-deposer d'un point sur une salle
        avec menu d'ordres (travailler, nettoyer, reparer, defendre, attaquer),
        postes vides cliquables depuis la fiche, ordres devenus par salle,
        salete et auto-entretien des salles tenues, traits lumineux de
        production vers les jauges, chiffres qui popent, debordement des
        reserves pleines, bulles de l'equipage et bouton micro. Deux bugs
        silencieux corriges : pilote du banc appelant un ordre disparu, et
        REPARE_MAT jamais ecrite (NaN sur l'integrite et les materiaux).
    v1 - la premiere tranche jouable. Neuf salles, quatre clones, l'energie qui
        coupe par priorite, l'usure et l'entretien, le cycle eau-vivres-oxygene-
        dechets, les besoins des corps, la cuve de decantation, et les deux
        fins. Un seul ecran, une seule chose a faire : affecter. Rendu en SVG
        et DOM, plus de canvas. Banc jouable (tools/banc.js) ecrit dans la
        foulee : huit naufrages avant equilibre, relais atteint au jour 1651.
-->
