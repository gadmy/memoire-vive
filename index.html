<!DOCTYPE html>
<!--
    SUIVI DE PROJET
    MEMOIRE VIVE
    Jeu web vanilla JS, sans dependance ni outil de construction.
    index.html tient la page et ce suivi, css/mv.css la feuille de style,
    js/*.js les sept morceaux du script, charges dans l'ordre.
    Pour jouer : ouvrir ce fichier. Aucun serveur n'est necessaire.

    VERSION : 1
    (la conversation en cours deviendra la v2 a la cloture : le numero ne
     bouge qu'au changement de conversation, jamais en cours de route)

    ================================================================
    CONVERSATION EN COURS - CE QUI VIENT D'ETRE FAIT
    ================================================================

    LE JEU EXISTE ET SE JOUE. Premiere tranche jouable, volontairement
    etroite : un seul ecran, le plan du vaisseau, et la seule chose qu'on y
    fait est d'AFFECTER DES GENS. Pas d'extraterrestres, pas de carte des
    etoiles, pas de construction, pas de sorties. Le but est de savoir tout
    de suite si le noyau est tendu ou plat, avant de batir quoi que ce soit
    par-dessus.

    NEUF SALLES, QUATRE CLONES. Chaque salle reclame des postes, du courant
    et des reserves. Les machines produisent toute l'energie ; tout le reste
    en consomme. Quand la demande depasse l'offre, les salles tombent dans un
    ordre de priorite fixe - le moteur d'abord, puisqu'il ne fait qu'avancer,
    la ferme en dernier - et le journal le dit. La salle de vie, elle, ne se
    coupe jamais : sans elle personne ne mange, et la partie serait perdue sur
    une simple baisse de courant. Avec quatre corps pour neuf salles, on ne
    peut pas tout tenir : c'est la le jeu.

    LES SALLES S'USENT. Une salle en marche perd de l'integrite chaque jour,
    et sous douze pour cent elle ne redemarre plus. Un clone mis a l'ENTRETIEN
    repare en continu la plus abimee - donc un clone de moins en production.
    Le controle, quand il est tenu, menage le materiel et accelere les
    reparations ; sans lui le moteur pousse dans le vide.

    LE CYCLE DES RESERVES SE BOUCLE. La ferme boit de l'eau et rend vivres et
    oxygene ; le recyclage avale les dechets et rend materiaux et eau ; les
    corps produisent des dechets rien qu'en vivant, et les morts aussi. Au-dela
    des trois quarts de la cuve, l'air devient malsain et tout le monde tombe
    malade.

    LES CLONES NE SONT PAS DES UNITES. Chacun nait avec le corps, le metier et
    un souvenir d'un mort de la Terre, et ce souvenir DONNE ses competences :
    le soudeur est bon en mecanique, la maraichere en botanique. Fatigue, faim,
    sante et moral multiplient ce qu'il vaut a son poste. Un clone epuise fait
    tourner une salle au ralenti - la vie du bord se paie en production.

    LA CUVE. 80 materiaux et 10 jours, un poste tenu et du courant, et un corps
    neuf ouvre les yeux avec un souvenir tire au sort. C'est la seule facon
    d'etre plus nombreux - et comme les materiaux ne viennent que du recyclage,
    grandir veut dire fermer le cycle des dechets.

    DEUX FINS. Le premier relais atteint (cent pour cent de progression), ou
    l'extinction quand plus personne ne respire.

    L'ARCHITECTURE EST CELLE DE TUAZ : des <script src> classiques et non des
    modules ES, donc une portee globale partagee et un jeu qui s'ouvre d'un
    double-clic. Le rendu, lui, change : plus de canvas, le plan est du SVG et
    les panneaux du DOM. Le texte reste net et les clics sont gratuits.

    ================================================================
    ETAT DES CHANTIERS
    ================================================================

    CE QUI RESTE VRAIMENT A FAIRE
    1. JOUER CETTE TRANCHE ET LE DIRE. Est-ce tendu ? Est-ce lisible ? Y a-t-il
       une decision interessante toutes les trente secondes ? Tant qu'on n'a pas
       repondu a ca, on ne construit rien de plus.
    2. Le reglage des chiffres : tout est dans js/00-config.js, une valeur par
       ligne. La premiere partie dira ce qui est trop dur ou trop mou.
    3. Les trois questions de conception encore ouvertes : la desobeissance
       (un clone demoralise travaille-t-il mal, ou refuse-t-il ?), ce que veut
       dire gagner, et l'echelle du die and retry (sauvegarde ou arche neuve).

    CE QUI VIENDRA SE BRANCHER DESSUS, DANS L'ORDRE PROBABLE
    - Le sas et les sorties : epaves, planetes, points bleus et rouges.
    - Les extraterrestres : abordage et vaisseau contre vaisseau.
    - Le chantier : poser, demolir et agrandir la coque.
    - L'armurerie : vetements, armes, materiel de minage.
    - La carte des etoiles et le choix du cap.
    - La technologie extraterrestre a etudier.

    LE BANC A TROUVE HUIT NAUFRAGES AVANT QUE LE JEU TIENNE. tools/banc.js joue
    une partie entiere en accelere avec un pilote automatique, et sort un
    tableau par vingt jours. Il a successivement montre : la salle de vie
    coupee en premier (tout le monde mourait de faim avec 150 vivres en
    reserve), l'epuisement simultane des quatre, le cycle de l'eau qui ne se
    refermait pas, l'usure qui emportait les machines, et le recyclage jamais
    tenu - donc plus de materiaux, donc plus de clones, donc un vaisseau fige
    a cinq qui meurt lentement. La partie tient maintenant : relais atteint au
    jour 1651 avec un pilote mediocre, et bien plus vite en jouant.

    LOG
    v1 - la premiere tranche jouable. Neuf salles, quatre clones, l'energie qui
        coupe par priorite, l'usure et l'entretien, le cycle eau-vivres-oxygene-
        dechets, les besoins des corps, la cuve de decantation, et les deux
        fins. Un seul ecran, une seule chose a faire : affecter. Rendu en SVG
        et DOM, plus de canvas. Banc jouable (tools/banc.js) ecrit dans la
        foulee : huit naufrages avant equilibre, relais atteint au jour 1651.
-->
