<!DOCTYPE html>
<!--
    SUIVI DE PROJET
    MEMOIRE VIVE
    Jeu web vanilla JS, sans dependance ni outil de construction.
    index.html tient la page et ce suivi, css/mv.css la feuille de style,
    js/*.js les huit morceaux du script, charges dans l'ordre.
    Pour jouer : ouvrir ce fichier. Aucun serveur n'est necessaire.

    VERSION : 2
    (la conversation en cours deviendra la v3 a la cloture : le numero ne
     bouge qu'au changement de conversation, jamais en cours de route)

    ================================================================
    CONVERSATION EN COURS - CE QUI VIENT D'ETRE FAIT
    ================================================================

    ON PREND LES GENS A LA MAIN. Un point bleu se SOULEVE a la souris, se
    promene sur le plan, et se lache dans une salle : un petit menu demande
    alors ce qu'il doit y faire - travailler, nettoyer, reparer, defendre, ou
    attaquer. Ce qui est impossible est grise et dit pourquoi ("deja propre",
    "rien a reparer", "aucun hostile"). Une fois l'ordre choisi, le clone part
    de la ou on l'a pris et marche jusqu'a la salle. Deuxieme chemin, pour les
    memes gestes : dans la fiche d'une salle, un poste vide s'ouvre d'un clic
    sur la liste de ceux qui ne font rien, classee par ce que chacun VAUT dans
    cette salle-la.

    LES ORDRES SONT DEVENUS DES ORDRES PAR SALLE. L'entretien flottant a
    disparu : on ne repare plus "la salle la plus abimee", on envoie quelqu'un
    reparer CELLE-CI. Reparer consomme des materiaux. Nettoyer retire la
    salete et la porte a la cuve a dechets, ou le recyclage en tire de la
    matiere - rien ne se perd. Defendre occupe la salle sans y travailler, et
    attaquer attend ses hostiles.

    LA SALETE, NOUVELLE PRESSION. Une salle qui tourne se salit. Les quarante
    premiers points sont gratuits ; au-dela, elle rend jusqu'a 30 pour cent de
    moins. C'est lent (0,30 par jour), donc c'est une corvee a placer, pas une
    urgence permanente.

    UNE SALLE TENUE S'ENTRETIENT SEULE. Un operateur graisse et resserre sans
    qu'on le lui demande : une salle ou quelqu'un travaille s'use trois fois
    moins, et une salle en veille ne pourrit plus. Sans cette regle il aurait
    fallu un reparateur a plein temps des le premier jour, et avec quatre corps
    il n'y en a pas.

    LE VAISSEAU RESPIRE, ET CA SE VOIT. Chaque fois qu'une salle produit, un
    trait lumineux part d'elle, longe la coursive et va se jeter dans la jauge
    concernee, en bas de l'ecran. Ce qui se consomme fait le trajet inverse, en
    plus sombre. Des chiffres popent dans la salle au depart et sur la jauge a
    l'arrivee - et en rouge quand une reserve pleine deborde, parce que remplir
    une cuve pleine, c'est jeter ce qu'on vient de produire.

    L'EQUIPAGE PARLE. Des bulles au-dessus des points : des banalites quand
    tout va, de l'incomprehension envers "la machine" quand une salle est sale,
    vide ou cassee - ils ne savent pas qu'un esprit humain les dirige - et de
    l'admiration quand le bord est propre et les reserves pleines. Deux bulles
    au maximum, et un bouton MICRO en haut a droite pour les couper.

    DEUX BUGS TROUVES EN CHEMIN, ET TOUS DEUX INVISIBLES. Le pilote du banc
    appelait un ordre qui n'existait plus : il n'a ni repare ni nettoye pendant
    plusieurs series de reglages, et j'ai equilibre le jeu sur un test faux.
    Et la constante REPARE_MAT n'avait jamais ete ecrite dans 00-config.js : un
    patch n'avait pas pris, silencieusement. Elle valait donc undefined, ce qui
    mettait l'integrite de la salle ET la reserve de materiaux a NaN. La
    fonction retire() refuse desormais toute valeur non finie et le dit dans le
    journal. Depuis, le relais est atteint au jour 408 avec un pilote mediocre.

    ================================================================
    ETAT DES CHANTIERS
    ================================================================

    CE QUI RESTE VRAIMENT A FAIRE
    1. JOUER CETTE TRANCHE ET LE DIRE. Est-ce tendu ? Est-ce lisible ? Y a-t-il
       une decision interessante toutes les trente secondes ?
    2. Le reglage des chiffres : tout est dans js/00-config.js. La v2 a ete
       equilibree au banc, pas a la main : le ressenti reste a confirmer.
    3. Les trois questions de conception encore ouvertes : la desobeissance
       (un clone demoralise travaille-t-il mal, ou refuse-t-il ?), ce que veut
       dire gagner, et l'echelle du die and retry (sauvegarde ou arche neuve).
    4. L'ordre ATTAQUER est en place mais toujours grise : il attend les
       hostiles.

    CE QUI VIENDRA SE BRANCHER DESSUS, DANS L'ORDRE PROBABLE
    - Le sas et les sorties : epaves, planetes, points bleus et rouges.
    - Les extraterrestres : abordage et vaisseau contre vaisseau. L'ordre
      ATTAQUER et l'ordre DEFENDRE les attendent deja.
    - Le chantier : poser, demolir et agrandir la coque.
    - L'armurerie : vetements, armes, materiel de minage.
    - La carte des etoiles et le choix du cap.
    - La technologie extraterrestre a etudier.

    LOG
    v2 - on prend les gens a la main. Glisser-deposer d'un point sur une salle
        avec menu d'ordres (travailler, nettoyer, reparer, defendre, attaquer),
        postes vides cliquables depuis la fiche, ordres devenus par salle,
        salete et auto-entretien des salles tenues, traits lumineux de
        production vers les jauges, chiffres qui popent, debordement des
        reserves pleines, bulles de l'equipage et bouton micro. Deux bugs
        silencieux corriges : pilote du banc appelant un ordre disparu, et
        REPARE_MAT jamais ecrite (NaN sur l'integrite et les materiaux).
    v1 - la premiere tranche jouable. Neuf salles, quatre clones, l'energie qui
        coupe par priorite, l'usure et l'entretien, le cycle eau-vivres-oxygene-
        dechets, les besoins des corps, la cuve de decantation, et les deux
        fins. Un seul ecran, une seule chose a faire : affecter. Rendu en SVG
        et DOM, plus de canvas. Banc jouable (tools/banc.js) ecrit dans la
        foulee : huit naufrages avant equilibre, relais atteint au jour 1651.
-->
